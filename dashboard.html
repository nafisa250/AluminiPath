<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Page-level overrides: dashboard layout ── */

        body {
            /* style.css centres content; dashboard needs full-width layout */
            display: block;
            padding: 0;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 16px 24px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: .04em;
            margin: 0;
        }

        /* ── Sidebar + Main wrapper ── */
        .container {
            display: flex;
            min-height: calc(100vh - 112px); /* full height minus header+footer */
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #f7d6e0;
            padding: 24px 16px;
        }

        .sidebar h2 {
            text-align: center;
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar li {
            padding: 10px 14px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: .9rem;
            color: var(--primary);
            transition: background .2s, color .2s;
        }

        .sidebar li:hover {
            background: var(--primary);
            color: white;
        }

        /* ── Main content area ── */
        .main {
            flex: 1;
            padding: 32px;
            background: var(--bg-page);
        }

        /* ── Dashboard stat cards ── */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            padding: 22px 16px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(26,35,126,.10);
            border-top: 4px solid var(--primary);
        }

        .stat-card h3 {
            font-size: .85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        /* ── Profile section ── */
        .profile {
            background: white;
            padding: 28px 32px;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
        }

        .profile h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
        }

        /* ── Footer ── */
        footer {
            text-align: center;
            padding: 16px;
            background: var(--primary);
            color: white;
            font-size: .88rem;
            font-weight: 600;
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                padding: 16px;
            }
            .sidebar ul {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .sidebar li {
                flex: 1;
                min-width: 120px;
                text-align: center;
            }
            .main {
                padding: 20px 16px;
            }
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
            .profile {
                padding: 20px 16px;
            }
        }

        @media (max-width: 420px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Alumni Portal Dashboard</h1>
    </header>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li>Profile</li>
                <li>Alumni Directory</li>
                <li>Job Opportunities</li>
                <li>Events</li>
                <li>Messages</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <!-- Stat Cards -->
            <section class="cards">
                <div class="stat-card">
                    <h3>Total Alumni</h3>
                    <p>1,245</p>
                </div>
                <div class="stat-card">
                    <h3>Jobs Posted</h3>
                    <p>54</p>
                </div>
                <div class="stat-card">
                    <h3>Upcoming Events</h3>
                    <p>6</p>
                </div>
                <div class="stat-card">
                    <h3>Messages</h3>
                    <p>12</p>
                </div>
            </section>

            <!-- Profile Form -->
            <section class="profile">
                <h2>Your Profile</h2>
                <form action="update_profile.php" method="post">
                    <fieldset>
                        <legend>Update Information</legend>

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter your name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email">
                        </div>

                        <div class="form-group">
                            <label for="grad_year">Graduation Year</label>
                            <input type="number" id="grad_year" name="grad_year" placeholder="e.g. 2022">
                        </div>

                        <div class="form-group">
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company" placeholder="Where do you work?">
                        </div>

                        <div class="form-group">
                            <label for="position">Position</label>
                            <input type="text" id="position" name="position" placeholder="Your job title">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                        </div>

                    </fieldset>
                </form>
            </section>

        </main>
    </div>

    <footer>
        <p>© 2026 Alumni Portal</p>
    </footer>

</body>
</html>
